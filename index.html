<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Add to Collection</h1>
        
        <form id="gameForm" class="bg-gray-800 p-6 rounded-lg shadow-xl space-y-4">
            <div>
                <label class="block text-sm mb-1">Franchise Name</label>
                <input type="text" id="franchiseName" class="w-full bg-gray-700 p-2 rounded" placeholder="e.g. Frogger" required>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">Game Title</label>
                    <input type="text" id="gameTitle" class="w-full bg-gray-700 p-2 rounded" required>
                </div>
                <div>
                    <label class="block text-sm mb-1">Release Year</label>
                    <input type="number" id="releaseYear" class="w-full bg-gray-700 p-2 rounded" required>
                </div>
            </div>
            <div>
                <label class="block text-sm mb-1">Status</label>
                <select id="status" class="w-full bg-gray-700 p-2 rounded">
                    <option>Not Played</option>
                    <option>Tried</option>
                    <option>Explored</option>
                    <option>Completed</option>
                    <option>Paused</option>
                    <option>Dropped</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded font-bold transition">Save to Library</button>
        </form>

        <div id="statusMessage" class="mt-4 text-center text-green-400 hidden">Game Added Successfully!</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
