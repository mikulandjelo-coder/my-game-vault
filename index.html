<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8 font-sans">
    <body class="bg-gray-900 text-gray-100 font-sans p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
            
            <div class="flex justify-between items-center mb-12 border-b border-gray-700 pb-4">
                <h1 onclick="goHome()" class="text-3xl font-bold cursor-pointer hover:text-purple-400 transition">Game Vault</h1>
                
                <div class="flex gap-4 items-center">
                    <div class="flex gap-2 mr-2 border-r border-gray-700 pr-4">
                        <button onclick="exportVault()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 px-3 rounded shadow transition border border-gray-700 flex items-center gap-1">
                            ⬇️ Export
                        </button>
                        <label class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 px-3 rounded shadow transition border border-gray-700 flex items-center gap-1 cursor-pointer">
                            ⬆️ Import
                            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importVault(event)">
                        </label>
                    </div>
    
                    <button onclick="openWishlist()" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 px-6 rounded-full shadow-lg transition flex items-center gap-2 border border-yellow-400">
                        ⭐ Wishlist
                    </button>
                    <button onclick="openModal()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded-full shadow-lg transition flex items-center gap-2 border border-purple-400">
                        + Add to Vault
                    </button>
                </div>
            </div>
            <div id="gameGrid" class="space-y-6"></div>
        </div>

        <div id="gameGrid" class="space-y-6"></div>
    </div> <div id="addModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden backdrop-blur-sm">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-600 w-full max-w-2xl relative max-h-[90vh] overflow-y-auto">            
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-3xl font-bold">&times;</button>
            
            <h2 class="text-2xl font-bold text-white mb-6">Add New Entry</h2>
            
            <form id="universalForm" class="space-y-6">
                <div class="flex gap-6 pb-4 border-b border-gray-700">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="entryType" value="game" checked onchange="toggleFormFields()" class="w-4 h-4 text-purple-600">
                        <span class="text-white font-bold text-lg">New Game</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="entryType" value="franchise" onchange="toggleFormFields()" class="w-4 h-4 text-green-500">
                        <span class="text-white font-bold text-lg">New Franchise</span>
                    </label>
                </div>

                <div id="franchiseFields" class="hidden space-y-4 border-l-4 border-green-500 pl-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Franchise Title</label>
                        <input type="text" id="fTitle" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-green-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Cover Photo URL (Optional)</label>
                        <input type="text" id="fCover" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-green-500" placeholder="https://...">
                    </div>
                </div>

                <div id="gameFields" class="space-y-4 border-l-4 border-purple-500 pl-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Target Franchise</label>
                            <select id="gFranchise" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500"></select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Category</label>
                            <select id="gCategory" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500">
                                <option value="mainGames">Main Game</option>
                                <option value="ports">Port</option>
                                <option value="remakes">Remake</option>
                                <option value="sequels">Sequel</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Game Title</label>
                            <input type="text" id="gTitle" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500">
                        </div>
                        <div class="col-span-full mb-4 mt-2">
                            <label class="block text-xs text-gray-400 mb-1">Cover Image URL (Optional)</label>
                            <input type="text" id="gCover" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500" placeholder="https://... (Leave blank for auto-generated placeholder)">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">Developer</label>
                                <input type="text" id="gDev" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500" placeholder="e.g. Nintendo">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">Genre</label>
                                <input type="text" id="gGenre" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500" placeholder="e.g. RPG, Platformer">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Year</label>
                            <input type="number" id="gYear" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Platform</label>
                            <input type="text" id="gPlatform" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Score (e.g. 85)</label>
                            <input type="text" id="gScore" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Play Status</label>
                            <select id="gPlayStatus" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500">
                                <option value="Not Played">Not Played</option>
                                <option value="Tried">Tried</option>
                                <option value="Explored">Explored</option>
                                <option value="Completed">Completed</option>
                                <option value="Paused">Paused</option>
                                <option value="Retired">Retired</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Ownership</label>
                            <select id="gOwnership" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500">
                                <option value="Not Owned">Not Owned</option>
                                <option value="Owned">Owned</option>
                                <option value="Emulated">Emulated</option>
                                <option value="Wishlisted">Wishlisted</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Attach to (If not Main Game)</label>
                        <select id="gParent" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500">
                            <option value="none">-- N/A (This is a Main Game) --</option>
                            <option value="frogger-1">Frogger (1981 Arcade)</option>
                            <option value="frogger-2">Frogger: The Great Quest</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 mt-6 border-t border-gray-700 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-8 rounded transition shadow-lg">
                        Save to Vault
                    </button>
                </div>
            </form>
        </div>
    </div>
        <div id="gameGrid" class="space-y-6"></div>
    </div>
    <script src="script.js"></script>
    <div id="detailsModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-gray-800 rounded-xl shadow-2xl border border-gray-600 w-full max-w-3xl relative flex flex-col md:flex-row overflow-hidden">
            
            <button onclick="closeDetailsModal()" class="absolute top-4 right-4 bg-gray-900/80 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center transition z-20 shadow-md">
                &times;
            </button>

            <div class="w-full md:w-2/5 bg-gray-900 flex-shrink-0">
                <img id="dCover" src="" class="w-full h-full object-cover aspect-[80/107] shadow-lg">
            </div>

            <div class="p-8 w-full md:w-3/5 flex flex-col justify-center">
                <p id="dFranchise" class="text-purple-400 text-xs font-bold uppercase tracking-wider mb-1"></p>
                <h2 id="dTitle" class="text-3xl font-bold text-white mb-2 leading-tight"></h2>
                
                <div class="flex gap-3 mb-6 border-b border-gray-700 pb-4">
                    <span id="dYear" class="bg-gray-700 text-gray-300 text-xs px-2 py-1 rounded font-bold"></span>
                    <span id="dPlatform" class="bg-gray-700 text-gray-300 text-xs px-2 py-1 rounded font-bold"></span>
                </div>

                <div class="grid grid-cols-2 gap-y-4 gap-x-6 mb-6">
                    <div>
                        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider mb-1">Genre</p>
                        <p id="dGenre" class="text-white font-semibold text-sm"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider mb-1">Developer</p>
                        <p id="dDev" class="text-white font-semibold text-sm"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider mb-1">Play Status</p>
                        <p id="dStatus" class="font-bold text-sm"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider mb-1">Ownership</p>
                        <p id="dOwnership" class="text-white font-semibold text-sm"></p>
                    </div>
                </div>

                <div class="mt-auto bg-gray-900 rounded-lg p-4 border border-gray-700 flex items-center justify-between">
                    <span class="text-gray-400 font-bold uppercase tracking-wider text-xs">Personal Score</span>
                    <span id="dScore" class="text-2xl font-black text-yellow-500"></span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
