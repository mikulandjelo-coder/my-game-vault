<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-gray-700 pb-4 gap-4">
            <h1 onclick="goHome()" class="text-3xl font-bold cursor-pointer hover:text-purple-400 transition">Game Vault</h1>
            
            <div class="relative w-full md:w-64 z-50">
                <input type="text" id="searchInput" onkeyup="handleSearch()" class="w-full bg-gray-800 text-white text-sm rounded py-2 px-4 outline-none border border-gray-600 focus:border-purple-500 transition" placeholder="Search (min 3 chars)..." autocomplete="off">
                <div id="searchResults" class="hidden absolute top-full left-0 right-0 bg-gray-800 border border-gray-600 mt-1 rounded shadow-xl max-h-64 overflow-y-auto"></div>
            </div>

            <div class="flex flex-wrap gap-4 items-center justify-center z-40">
                <div class="flex gap-2 border-r border-gray-700 pr-4">
                    <button onclick="exportVault()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 px-3 rounded shadow transition border border-gray-700 flex items-center gap-1">
                        ⬇️ Export
                    </button>
                    <label class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 px-3 rounded shadow transition border border-gray-700 flex items-center gap-1 cursor-pointer">
                        ⬆️ Import
                        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importVault(event)">
                    </label>
                </div>

                <button onclick="openGlobalAllGames()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-full shadow-lg transition flex items-center gap-2 border border-blue-400 text-sm">
                    🌍 All Games
                </button>
                <button onclick="openWishlist()" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 px-4 rounded-full shadow-lg transition flex items-center gap-2 border border-yellow-400 text-sm">
                    ⭐ Wishlist
                </button>
                <button onclick="openModal()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-full shadow-lg transition flex items-center gap-2 border border-purple-400 text-sm">
                    + Add to Vault
                </button>
            </div>
        </div>

        <div id="gameGrid" class="space-y-6"></div>
    </div>

    <div id="addModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-lg p-6 w-full max-w-2xl border border-gray-600 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-white">Add New Entry</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            
            <form id="universalForm">
                <div class="flex gap-4 mb-6 border-b border-gray-700 pb-4">
                    <label class="flex items-center gap-2 text-white cursor-pointer">
                        <input type="radio" name="entryType" value="franchise" checked onchange="toggleFormFields()" class="accent-purple-500"> Master Franchise
                    </label>
                    <label class="flex items-center gap-2 text-white cursor-pointer">
                        <input type="radio" name="entryType" value="game" onchange="toggleFormFields()" class="accent-purple-500"> Specific Game
                    </label>
                </div>

                <div id="franchiseFields" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Franchise Name</label>
                        <input type="text" id="fTitle" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500" placeholder="e.g. The Legend of Zelda">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Master Cover Art URL</label>
                        <input type="text" id="fCover" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500" placeholder="https://...">
                    </div>
                </div>

                <div id="gameFields" class="hidden space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-gray-900 p-3 rounded border border-gray-700 mb-4">
                        <div>
                            <label class="block text-xs text-purple-400 mb-1 font-bold">1. Franchise</label>
                            <select id="gFranchise" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600"></select>
                        </div>
                        <div>
                            <label class="block text-xs text-purple-400 mb-1 font-bold">2. Category</label>
                            <select id="gCategory" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600">
                                <option value="mainGames">Main Game</option>
                                <option value="ports">Port</option>
                                <option value="remakes">Remake</option>
                                <option value="sequels">Sequel</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-purple-400 mb-1 font-bold">3. Attach To</label>
                            <select id="gParent" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600">
                                </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Game Title</label>
                        <input type="text" id="gTitle" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500">
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Release Year</label>
                            <input type="number" id="gYear" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Platform</label>
                            <input type="text" id="gPlatform" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Personal Score</label>
                            <input type="number" id="gScore" min="0" max="100" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Play Status</label>
                            <select id="gPlayStatus" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600">
                                <option value="Not Played">Not Played</option>
                                <option value="Tried">Tried</option>
                                <option value="Explored">Explored</option>
                                <option value="Completed">Completed</option>
                                <option value="Paused">Paused</option>
                                <option value="Retired">Retired</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Developer</label>
                            <input type="text" id="gDev" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500" placeholder="e.g. Nintendo">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Genre</label>
                            <input type="text" id="gGenre" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500" placeholder="e.g. RPG, Platformer">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Ownership</label>
                            <select id="gOwnership" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600">
                                <option value="Not Owned">Not Owned</option>
                                <option value="Wishlisted">Wishlisted</option>
                                <option value="Owned Physical">Owned Physical</option>
                                <option value="Owned Digital">Owned Digital</option>
                                <option value="Subscription">Subscription (GamePass/PS+)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Cover Art URL</label>
                            <input type="text" id="gCover" class="w-full bg-gray-700 text-white rounded p-2 outline-none border border-gray-600 focus:border-purple-500" placeholder="Optional">
                        </div>
                    </div>
                </div>

                <button type="submit" class="mt-6 w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded shadow transition">
                    Save to Vault
                </button>
            </form>
        </div>
    </div>

    <div id="detailsModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-gray-800 rounded-xl shadow-2xl border border-gray-600 w-full max-w-3xl relative flex flex-col md:flex-row overflow-hidden">
            
            <button onclick="closeDetailsModal()" class="absolute top-4 right-4 bg-gray-900/80 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center transition z-20 shadow-md">
                &times;
            </button>

            <div class="w-full md:w-2/5 bg-gray-900 flex-shrink-0">
                <img id="dCover" src="" class="w-full h-full object-cover aspect-[80/107] shadow-lg">
            </div>

            <div class="p-8 w-full md:w-3/5 flex flex-col justify-center">
                <p id="dFranchise" class="text-purple-400 text-xs font-bold uppercase tracking-wider mb-1"></p>
                <h2 id="dTitle" class="text-3xl font-bold text-white mb-2 leading-tight"></h2>
                
                <div class="flex gap-3 mb-6 border-b border-gray-700 pb-4">
                    <span id="dYear" class="bg-gray-700 text-gray-300 text-xs px-2 py-1 rounded font-bold"></span>
                    <span id="dPlatform" class="bg-gray-700 text-gray-300 text-xs px-2 py-1 rounded font-bold"></span>
                </div>

                <div class="grid grid-cols-2 gap-y-4 gap-x-6 mb-6">
                    <div>
                        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider mb-1">Genre</p>
                        <p id="dGenre" class="text-white font-semibold text-sm"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider mb-1">Developer</p>
                        <p id="dDev" class="text-white font-semibold text-sm"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider mb-1">Play Status</p>
                        <p id="dStatus" class="font-bold text-sm"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-wider mb-1">Ownership</p>
                        <p id="dOwnership" class="text-white font-semibold text-sm"></p>
                    </div>
                </div>

                <div class="mt-auto bg-gray-900 rounded-lg p-4 border border-gray-700 flex items-center justify-between">
                    <span class="text-gray-400 font-bold uppercase tracking-wider text-xs">Personal Score</span>
                    <span id="dScore" class="text-2xl font-black text-yellow-500"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
